<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icones/icone-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icones/icone-192.png" />
  <meta name="theme-color" content="#0e1012" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CorretoresAI" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Central de Conteúdo — CorretoresAI</title>
  <link rel="stylesheet" href="../assets/base.css" />
  <link rel="stylesheet" href="../assets/app.css" />
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("corretoresai-theme") || "dark"; } catch (e) { document.documentElement.dataset.theme = "dark"; }</script>
</head>
<body data-page="central" data-title="Central de Conteúdo" data-subtitle="Da ideia ao roteiro pronto para gravar">

<main class="view">
  <div class="view-head">
    <div>
      <p class="chip" style="margin-bottom:14px">
        <svg><use href="#i-sparkle" /></svg>
        A plataforma
      </p>
      <h1>Sua central de conteúdo imobiliário</h1>
      <p class="quota" data-quota></p>
    </div>

    <div class="segmented" style="margin-left:auto">
      <button type="button" aria-pressed="true"><svg><use href="#i-wand" /></svg>Criar</button>
      <button type="button" aria-pressed="false" data-goto="calendario.html"><svg><use href="#i-calendar" /></svg>Calendário</button>
    </div>
  </div>

  <form class="form-card" data-generator>
    <div class="field">
      <label for="area">Área de atuação</label>
      <select id="area" name="area"></select>
    </div>

    <div class="field">
      <label for="briefing">Descreva o imóvel ou conteúdo <small>(opcional)</small></label>
      <textarea id="briefing" name="briefing" placeholder="Ex: Apartamento de 47m², 2 dormitórios, 1 vaga, varanda gourmet, metrô a pé, R$ 890 mil"></textarea>
      <p class="hint">Metragem, dormitórios, vagas, valor e diferenciais entram direto no roteiro. Acentuação e capitalização são corrigidas automaticamente.</p>
    </div>

    <div class="field field-row">
      <div>
        <label for="cidade">Cidade ou região <small>(opcional)</small></label>
        <input id="cidade" name="cidade" placeholder="Ex: São Paulo, Higienópolis" />
        <p class="hint" data-eco-cidade></p>
      </div>
      <div>
        <label for="foto">Foto do imóvel <small>(link, opcional)</small></label>
        <input id="foto" name="foto" placeholder="Cole o link da foto principal" />
      </div>
    </div>

    <div class="field">
      <label>Estágio do funil de conteúdo</label>
      <div class="choice-row" data-choice="funil">
        <button type="button" aria-pressed="true">Topo</button>
        <button type="button" aria-pressed="false">Meio</button>
        <button type="button" aria-pressed="false">Fundo</button>
        <button type="button" aria-pressed="false">Personalizado</button>
      </div>
    </div>

    <div class="field">
      <label>Formato do conteúdo</label>
      <div class="choice-row" data-choice="formato">
        <button type="button" aria-pressed="true">Reels</button>
        <button type="button" aria-pressed="false">Carrossel</button>
        <button type="button" aria-pressed="false">Stories</button>
        <button type="button" aria-pressed="false">TikTok</button>
      </div>
    </div>

    <button class="generate-btn" type="submit">
      <svg><use href="#i-wand" /></svg>
      Gerar ideias de conteúdo
    </button>

    <p style="text-align:center;margin:16px 0 0">
      <button class="btn btn-quiet" type="button" data-limpar>Limpar formulário</button>
    </p>
  </form>

  <section class="ideas" data-ideas style="max-width:820px"></section>
</main>

<script src="../assets/theme.js"></script>
<script src="../assets/texto.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/roteiro.js"></script>
<script src="../assets/db.js"></script>
<script src="../assets/store.js"></script>
<script src="../assets/config.js"></script>
<script src="../assets/ui.js"></script>
<script src="../assets/conhecimento.js"></script>
<script src="../assets/assistente.js"></script>
<script src="../assets/auth.js"></script>
<script src="../assets/shell.js"></script>
<script src="../assets/central.js"></script>
<script src="../assets/instalar.js"></script>
</body>
</html>
