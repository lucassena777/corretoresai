<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icones/icone-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icones/icone-192.png" />
  <meta name="theme-color" content="#0e1012" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CorretoresAI" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Biblioteca — CorretoresAI</title>
  <link rel="stylesheet" href="../assets/base.css" />
  <link rel="stylesheet" href="../assets/app.css" />
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("corretoresai-theme") || "dark"; } catch (e) { document.documentElement.dataset.theme = "dark"; }</script>
</head>
<body data-page="biblioteca" data-title="Biblioteca" data-subtitle="Todo o seu acervo de conteúdo">

<main class="view">
  <div class="view-head">
    <div>
      <h1>Biblioteca</h1>
      <p>Todo o conteúdo que você já criou, com busca e filtros por categoria, data, formato, funil e status.</p>
    </div>
    <div class="head-actions">
      <button class="btn btn-outline" type="button" data-exportar>
        <svg><use href="#i-download" /></svg>
        Exportar
      </button>
      <a class="btn btn-primary" href="central.html">
        <svg><use href="#i-plus" /></svg>
        Criar conteúdo
      </a>
    </div>
  </div>

  <div class="filtros">
    <div class="busca">
      <svg><use href="#i-search" /></svg>
      <input data-search placeholder="Buscar por título, gancho, legenda, tag ou hashtag…" />
    </div>

    <div class="filtros-linha">
      <select data-filtro="area" aria-label="Categoria"></select>
      <select data-filtro="periodo" aria-label="Data">
        <option value="">Qualquer data</option>
        <option value="7">Últimos 7 dias</option>
        <option value="30">Últimos 30 dias</option>
        <option value="mes">Este mês</option>
        <option value="futuro">Próximos dias</option>
      </select>
      <select data-filtro="format" aria-label="Formato"></select>
      <select data-filtro="funnel" aria-label="Funil"></select>
      <select data-filtro="status" aria-label="Status"></select>
    </div>

    <div class="filtros-rodape">
      <p><svg><use href="#i-filter" /></svg> <span data-count></span></p>
      <button class="link" type="button" data-limpar>Limpar filtros</button>
    </div>
  </div>

  <div class="cards-grid" data-library></div>
</main>

<script src="../assets/theme.js"></script>
<script src="../assets/texto.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/roteiro.js"></script>
<script src="../assets/db.js"></script>
<script src="../assets/store.js"></script>
<script src="../assets/config.js"></script>
<script src="../assets/ui.js"></script>
<script src="../assets/conhecimento.js"></script>
<script src="../assets/assistente.js"></script>
<script src="../assets/auth.js"></script>
<script src="../assets/shell.js"></script>
<script src="../assets/biblioteca.js"></script>
<script src="../assets/instalar.js"></script>
</body>
</html>
